<body>
  <main id="screen">

    <!-- "all projects" view. Hidden unless the URL is #all-projects.
         Toggling is pure CSS (:target) — no JS navigation involved. -->
    <section id="all-projects">
      <a href="#" class="back-link">&larr; back</a>
      <h2 class="section-heading" id="all-projects-heading">$ all projects</h2>
      <ul id="projects-full" class="project-list"></ul>
    </section>

    <!-- home view. Shown by default. -->
    <section id="home">
      <div id="neofetch"></div>

      <div id="home-content">
        <div class="home-section">
          <h2 class="section-heading">$ links</h2>
          <ul id="social-links" class="link-list"></ul>
        </div>
        <div class="home-section">
          <h2 class="section-heading">$ projects</h2>
          <ul id="projects-preview" class="project-list"></ul>
          <div id="see-all-wrap"></div>
        </div>
      </div>
    </section>

    </main>

  <script src="./config.js"></script>
  <script src="./render.js"></script>
</body>
